<!-- Normalize gcds-card images across shadow DOM -->
<script>
function normalizeCardImages() {
  document.querySelectorAll('gcds-card[role="listitem"]').forEach(card => {
    if (!card.shadowRoot) return;
    card.shadowRoot.querySelectorAll('img').forEach(img => {
      img.style.height = '160px';
      img.style.maxHeight = '160px';
      img.style.width = 'auto';
      img.style.maxWidth = '200px';
      img.style.objectFit = 'contain';
      img.style.margin = '0 auto 1.5rem';
      img.style.display = 'block';
      img.parentElement.style.textAlign = 'initial';
    });
  });
}
function waitForCards() {
  if (document.querySelectorAll('gcds-card[role="listitem"]').length) {
    normalizeCardImages();
  }
  requestAnimationFrame(waitForCards);
}
requestAnimationFrame(waitForCards);
</script>
