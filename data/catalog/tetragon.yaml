name: "Tetragon"
slug: "tetragon"
alias: "eBPF Runtime Enforcement"
productVersion: "v1.7.0"

category:
  hld: "Security"
  type: "Core"

descriptions:
  short: "Tetragon provides real-time runtime security enforcement and tracing for Kubernetes using eBPF."
  short_fr: "Tetragon fournit l'application de la sécurité à l'exécution en temps réel et le traçage pour Kubernetes à l'aide d'eBPF."
  long: >-
    Tetragon is used within Aurora to provide real-time runtime security
    enforcement and deep system observability for Kubernetes workloads using
    eBPF. It enables policy-driven detection and prevention of undesired process,
    file, and network activity at the kernel level, without requiring application
    instrumentation. Tetragon complements admission-time controls and passive
    detection by enabling active enforcement and fine-grained runtime policy
    aligned with zero-trust and defense-in-depth security models.
  long_fr: >-
    Tetragon est utilisé dans Aurora pour fournir l'application de la sécurité
    à l'exécution en temps réel et une observabilité approfondie du système
    pour les charges de travail Kubernetes à l'aide d'eBPF. Il permet la
    détection et la prévention pilotées par des politiques des activités de
    processus, de fichiers et de réseau indésirables au niveau du noyau, sans
    nécessiter d'instrumentation applicative. Tetragon complète les contrôles
    lors de l'admission et la détection passive en permettant l'application
    active et les politiques à l'exécution fines, alignées sur les modèles de
    sécurité à confiance zéro et de défense en profondeur.

capabilities:
  - runtime-security
  - runtime-enforcement
  - ebpf
  - process-monitoring
  - kernel-tracing
  - zero-trust

relationships:
  parent: "cilium"
  type: "subcomponent"

project:
  homepage: "https://tetragon.io/"
  documentation: "https://docs.cilium.io/en/stable/observability/tetragon/"
  cncf_landscape: "https://landscape.cncf.io/?item=provisioning--security-compliance--tetragon"
  license: "Apache-2.0"

deployment:
  deployed_in:
    - "management-clusters"
    - "workload-clusters"
  deployment_model: "Helm"
  ownership:
    team: "SIG: Security"
    steward: "Aurora Platform Team"
  criticality: "high"

architecture:
  role: >-
    Acts as the runtime enforcement and tracing layer for Kubernetes workloads,
    observing and optionally blocking process execution, file access, and
    network activity using eBPF programs attached to kernel hooks.
  control_plane_components:
    - "tetragon-agent"
    - "tetragon-operator"

integrations:
  integrates_with:
    - "Cilium"
    - "Kubernetes API Server"
    - "Security monitoring and alerting systems"
  optional_features:
    - "Policy-based enforcement"
    - "Process and syscall tracing"
    - "Export of security events"

dependencies:
  requires:
    - "Cilium"
    - "Kubernetes"
    - "Kernel with eBPF support"
  conflicts_with: []

references:
